name: Test XS codecs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  immutable-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # This commit is the six frozen assets in MAGPIE-DATA #17. It remains
      # valid after that PR merges; no unmerged download_data.sh release needed.
      - uses: actions/checkout@v4
        with:
          repository: jvc56/MAGPIE-DATA
          ref: 756635970945ff99fd4b11551476622c48c29b7f
          path: xs-data
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/xs/
            /data/lexica/CSW24.kwg
            /data/lexica/CSW24.klv2
            /data/lexica/NWL23.kwg
            /data/lexica/NWL23.klv2
            /data/validate_xs_data.py
            /data/xs_codebook.py
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Verify immutable asset manifest
        run: python3 xs-data/data/validate_xs_data.py
      - name: Build with address and undefined-behavior sanitizers
        run: make magpie_test CC=clang
      - name: Test wire formats and both frozen English profiles
        env:
          MAGPIE_XS_DATA: ${{ github.workspace }}/xs-data/data
        run: ./bin/magpie_test xs xsdata
