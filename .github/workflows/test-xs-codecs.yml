name: Test XS codecs
# Pushes to main, and pull requests into main. A pull request stacked on
# another branch runs once it targets main, when its branch is next pushed.
# workflow_dispatch runs it on any branch by hand.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
# One run per pull request (or branch) at a time: a new push cancels the run
# it replaces, except on main, whose every run finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  immutable-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Pin codec data so compatibility tests use immutable codebooks and ranking assets.
      - uses: actions/checkout@v4
        with:
          repository: jvc56/MAGPIE-DATA
          ref: c4216b80098e8c7e88262cb5d04d0bc033bc4d46
          path: xs-data
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/xs/
            /data/lexica/CSW24.kwg
            /data/lexica/CSW24.klv2
            /data/lexica/NWL23.kwg
            /data/lexica/NWL23.klv2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build with address and undefined-behavior sanitizers
        run: make magpie_test word_frequencies BUILD=sanitize CC=clang
      - name: Test wire formats and both frozen English profiles
        run: ./bin/magpie_test xs xsdata:xs-data/data
