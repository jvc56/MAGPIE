name: Test WASM Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "latest"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get datafile cache
        id: cache-datafiles
        uses: actions/cache@v3
        with:
          path: |
            data/*
            testdata/*
          key: downloaded-data-files-wasm-31

      - name: Download data files and convert lexica
        if: steps.cache-datafiles.outputs.cache-hit != 'true'
        run: ./download_data.sh && ./convert_lexica.sh

      - name: Build WASM
        run: make clean && make -f Makefile-wasm magpie_wasm

      - name: Build WASM tests
        run: make -f Makefile-wasm magpie_wasm_test

      - name: Run WASM unit tests
        run: |
          node bin/magpie_wasm_test.js tt
          node bin/magpie_wasm_test.js endgame

      - name: Install Playwright dependencies
        working-directory: ./wasmentry
        run: |
          npm install
          npx playwright install --with-deps chromium webkit firefox msedge

      - name: Cache optional WMP test downloads
        id: cache-wmp
        uses: actions/cache@v3
        with:
          path: |
            data/wmp/
            data/wmp-manifest.json
          key: wasm-test-wmp-${{ hashFiles('src/**', 'wasmentry/build_wmp_assets.py', 'data/lexica/CSW24.kwg', 'data/lexica/NWL23.kwg') }}

      - name: Build optional WMP downloads
        if: steps.cache-wmp.outputs.cache-hit != 'true'
        run: |
          make -j2 magpie BUILD=no_pgo_release
          python3 wasmentry/build_wmp_assets.py --threads 2

      - name: Run Playwright tests
        env:
          MAGPIE_TEST_EDGE: "1"
        working-directory: ./wasmentry
        run: npm test

      - name: Package Magpie beta
        run: python3 wasmentry/package_preview.py preview-dist

      - name: Upload Magpie beta
        uses: actions/upload-artifact@v6
        with:
          name: magpie-wasm-preview
          path: preview-dist/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            wasmentry/test-results/
            wasmentry/playwright-report/
