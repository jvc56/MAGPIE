name: Test WASM Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get datafile cache
        id: cache-datafiles
        uses: actions/cache@v4
        with:
          path: |
            data/*
            testdata/*
          key: downloaded-data-files-wasm-31

      - name: Download data files and convert lexica
        if: steps.cache-datafiles.outputs.cache-hit != 'true'
        run: ./download_data.sh && ./convert_lexica.sh

      - name: Build WASM
        run: make clean && make -f Makefile-wasm magpie_wasm

      - name: Fetch pinned preview codec data
        run: python3 wasmentry/fetch_preview_data.py

      - name: Build WASM tests
        run: make -f Makefile-wasm magpie_wasm_test

      - name: Run WASM unit tests
        run: |
          node bin/magpie_wasm_test.js tt browsergame
          node bin/magpie_wasm_test.js endgame

      # Keyed by what the files are built from, not by all of src/: the WMP
      # builder's version and the WMP format's (a builder change that alters
      # its output fails builderhash until the version is bumped), the
      # script, the lexica and their letter distributions. Hashing src/**
      # saved another 67 MB entry for every C change.
      - name: Cache optional WMP test downloads
        id: cache-wmp
        uses: actions/cache@v4
        with:
          path: |
            data/wmp/
            data/wmp-manifest.json
          key: wasm-test-wmp-${{ hashFiles('src/def/builder_defs.h', 'src/def/wmp_defs.h', 'wasmentry/build_wmp_assets.py', 'data/lexica/CSW24.kwg', 'data/lexica/NWL23.kwg', 'data/letterdistributions/**') }}

      - name: Build optional WMP downloads
        if: steps.cache-wmp.outputs.cache-hit != 'true'
        run: |
          make -j2 magpie BUILD=no_pgo_release
          python3 wasmentry/build_wmp_assets.py --threads 2

      - name: Package test assets
        run: |
          python3 wasmentry/package_preview.py preview-dist --with-wmp
          tar -czf /tmp/wasm-browser-assets.tgz -C preview-dist data wasmentry/magpie_wasm.mjs wasmentry/magpie_wasm.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-browser-assets
          path: /tmp/wasm-browser-assets.tgz
          retention-days: 1

  browser-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's image has Chromium, Firefox and WebKit and their system
    # libraries installed, so no shard waits on apt or a browser download.
    # Its tag must match @playwright/test in wasmentry/package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2, 3]
        include:
          - project: unit
            shard: 1
          - project: static-host
            shard: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wasmentry/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wasm-browser-assets
          path: /tmp/wasm-browser-assets
      - name: Unpack engine and data
        run: tar -xzf /tmp/wasm-browser-assets/wasm-browser-assets.tgz
      - run: npm ci
        working-directory: wasmentry
      - name: Check Playwright matches the image
        working-directory: wasmentry
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          if [ "$version" != 1.63.0 ]; then
            echo "::error::@playwright/test is $version; update the container image tag to v$version-noble"
            exit 1
          fi
      - name: Run Playwright shard
        working-directory: wasmentry
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
        run: |
          total=3
          case "$PROJECT" in unit|static-host) total=1 ;; esac
          npm test -- --project="$PROJECT" --shard="$SHARD/$total"
      # Keep WebKit's first-attempt traces even when its bounded retry passes.
      - name: Upload browser report
        if: ${{ !cancelled() && (failure() || matrix.project == 'webkit') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            wasmentry/test-results/
            wasmentry/playwright-report/
          retention-days: 7

  # Edge is not in Playwright's image, so this job installs it on the runner.
  edge-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wasmentry/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wasm-browser-assets
          path: /tmp/wasm-browser-assets
      - name: Unpack engine and data
        run: tar -xzf /tmp/wasm-browser-assets/wasm-browser-assets.tgz
      - run: npm ci
        working-directory: wasmentry
      - name: Install Edge
        working-directory: wasmentry
        run: npx playwright install --with-deps msedge
      - name: Run Edge test
        working-directory: wasmentry
        env:
          MAGPIE_TEST_EDGE: "1"
        run: npm test -- --project=edge
      - name: Upload browser report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-edge-1
          path: |
            wasmentry/test-results/
            wasmentry/playwright-report/
          retention-days: 7

  test-wasm:
    # Preserve the aggregate check name and only publish a beta when every shard passes.
    if: always()
    needs: [build, browser-tests, edge-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require all shards to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.browser-tests.result }}
          EDGE_RESULT: ${{ needs.edge-test.result }}
        run: |
          test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success &&
            test "$EDGE_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          name: wasm-browser-assets
          path: /tmp/wasm-browser-assets
      - run: tar -xzf /tmp/wasm-browser-assets/wasm-browser-assets.tgz
      - name: Package Magpie beta
        run: python3 wasmentry/package_preview.py preview-dist
      - uses: actions/upload-artifact@v4
        with:
          name: magpie-wasm-preview
          path: preview-dist/
          retention-days: 14
