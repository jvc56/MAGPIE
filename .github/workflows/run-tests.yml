name: ci
on: [push]
jobs:
  lint-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install networkx
          sudo apt-get update
          sudo apt-get install -y clang-format-20

      - name: Check circular dependencies
        run: python3 find_circ_deps.py

      - name: Check that platform-specific code stays in src/compat
        run: python3 check_portability.py

      - name: Check that data fetch and download_data.sh fetch the same data
        run: |
          fetched=$(sed -n 's/^#define DATA_FETCH_VERSION "\(.*\)"/\1/p' src/impl/data_fetch.h)
          downloaded=$(sed -n 's/^DATA_VERSION="\(.*\)"/\1/p' download_data.sh)
          echo "data fetch: $fetched, download_data.sh: $downloaded"
          test -n "$fetched" && test "$fetched" = "$downloaded"

      - name: Check formatting
        run: python3 ./format.py

  windows-cross-compile:
    runs-on: ubuntu-latest
    env:
      # The pinned toolchain, with the SHA-256 of its release tarball (also
      # the digest GitHub reports for the asset). Keep in step with
      # release-windows.yml and windows/Dockerfile.
      LLVM_MINGW_VERSION: "20261006"
      LLVM_MINGW: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_SHA256: 5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4
    steps:
      - uses: actions/checkout@v3

      # The cache holds the tarball itself, keyed by its checksum, and is
      # saved only when the job succeeds, after the tarball was verified. It
      # is verified again before every unpack, so a tampered cache entry
      # fails the job instead of compiling with it.
      - name: Get llvm-mingw cache
        id: cache-llvm-mingw
        uses: actions/cache@v3
        with:
          path: ~/llvm-mingw-download
          key: ${{ env.LLVM_MINGW }}-sha256-${{ env.LLVM_MINGW_SHA256 }}

      - name: Download llvm-mingw
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/llvm-mingw-download
          curl -fsSL -o ~/llvm-mingw-download/$LLVM_MINGW.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$LLVM_MINGW.tar.xz"

      - name: Verify and unpack llvm-mingw
        run: |
          echo "$LLVM_MINGW_SHA256  $HOME/llvm-mingw-download/$LLVM_MINGW.tar.xz" | sha256sum -c --strict -
          mkdir -p ~/llvm-mingw
          tar xJf ~/llvm-mingw-download/$LLVM_MINGW.tar.xz -C ~/llvm-mingw

      - name: Compile every C file for x64 and arm64 Windows
        run: |
          export PATH="$HOME/llvm-mingw/$LLVM_MINGW/bin:$PATH"
          python3 check_windows_compile.py --cc x86_64-w64-mingw32-clang --cc aarch64-w64-mingw32-clang

      - name: Lint src/compat's Windows branches with clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18
          MINGW_SYSROOT="$HOME/llvm-mingw/$LLVM_MINGW" ./tidy.sh clang-tidy-18 windows

      - name: Link magpie.exe and magpie_test.exe for x64 and arm64
        run: |
          export PATH="$HOME/llvm-mingw/$LLVM_MINGW/bin:$PATH"
          for arch in x86_64 aarch64; do
            march=nehalem
            if [ "$arch" = aarch64 ]; then march=armv8-a; fi
            make magpie magpie_test BUILD=portable_release PORTABLE_MARCH=$march CC=$arch-w64-mingw32-clang
            mkdir -p windows-$arch
            mv bin/magpie.exe bin/magpie_test.exe windows-$arch/
          done

      - name: Upload the x64 executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: windows-x86_64/*.exe
          retention-days: 7

      - name: Upload the arm64 executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-aarch64
          path: windows-aarch64/*.exe
          retention-days: 7

  # The data cache with its symlinks turned into copies, for Windows runners:
  # the tarballs' 27 symlinks would not survive a restore there. Built once
  # per data version and cached across operating systems.
  windows-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Look up the Windows data cache
        id: windows-data
        uses: actions/cache/restore@v4
        with:
          path: windows-data
          key: windows-data-files-32
          enableCrossOsArchive: true
          lookup-only: true

      - name: Get datafile cache
        if: steps.windows-data.outputs.cache-hit != 'true'
        id: cache-datafiles
        uses: actions/cache@v3
        with:
          path: |
            data/*
            testdata/*
          key: downloaded-data-files-32

      - name: Download data files and convert lexica
        if: steps.windows-data.outputs.cache-hit != 'true' && steps.cache-datafiles.outputs.cache-hit != 'true'
        run: ./download_data.sh && ./convert_lexica.sh

      - name: Copy the data without symlinks
        if: steps.windows-data.outputs.cache-hit != 'true'
        run: |
          mkdir -p windows-data
          cp -rL data testdata windows-data/

      - name: Save the Windows data cache
        if: steps.windows-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: windows-data
          key: windows-data-files-32
          enableCrossOsArchive: true

  # L3: the x64 test binary under Wine, which catches most runtime problems
  # (text mode, paths, threads) on Linux.
  windows-wine-tests:
    needs: windows-cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v3

      - name: Get datafile cache
        id: cache-datafiles
        uses: actions/cache@v3
        with:
          path: |
            data/*
            testdata/*
          key: downloaded-data-files-32

      - name: Download data files and convert lexica
        if: steps.cache-datafiles.outputs.cache-hit != 'true'
        run: ./download_data.sh && ./convert_lexica.sh

      - name: Download the x64 executables
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: bin

      - name: Install Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64

      - name: Run the tests under Wine
        env:
          WINEDEBUG: -all
        run: wine bin/magpie_test.exe

  # L4: the same executables on real Windows, x64 and arm64.
  windows-native-tests:
    needs: [windows-cross-compile, windows-data]
    name: windows-native-tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v3

      - name: Get the Windows data cache
        uses: actions/cache/restore@v4
        with:
          path: windows-data
          key: windows-data-files-32
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Put the data in place
        shell: bash
        run: mv windows-data/data windows-data/testdata .

      - name: Download the executables
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: bin

      - name: Run the tests on Windows
        shell: bash
        run: ./bin/magpie_test.exe

  # cppcheck's first pass, a share of the files per job (see
  # shard_cppcheck.py). A shard always passes unless it breaks: the cppcheck
  # job below reports the findings.
  cppcheck-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v3

      # The built binary with its cfg/ beside it, which is all cppcheck.sh
      # needs to skip the build: about 5 MB, where the source and build trees
      # were 133.
      - name: Cache cppcheck binary
        uses: actions/cache@v4
        with:
          path: cppcheck_dir/build/bin
          key: cppcheck-2.17.1-bin

      # The results the cppcheck job saved last (see there), so the shard
      # analyzes only its files whose hash changed.
      - name: Restore cppcheck results
        uses: actions/cache/restore@v4
        with:
          path: |
            cppcheck_build
            cppcheck_build-windows
          key: cppcheck-results-2.17.1-${{ hashFiles('cppcheck.sh') }}-${{ github.run_id }}
          restore-keys: cppcheck-results-2.17.1-${{ hashFiles('cppcheck.sh') }}-

      - name: Run cppcheck on this shard
        env:
          CPPCHECK_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: ./cppcheck.sh

      - name: Collect this shard's results
        run: python3 shard_cppcheck.py collect cppcheck_build cppcheck-shard-results

      - uses: actions/upload-artifact@v4
        with:
          name: cppcheck-shard-${{ matrix.shard }}
          path: cppcheck-shard-results/
          retention-days: 1

  # Runs cppcheck.sh over the shards' merged results. It analyzes no file a
  # shard checked, reports every file's findings, and runs the whole-program
  # checks, which only see the files in one run, and the _WIN32 pass.
  cppcheck:
    if: ${{ !cancelled() }}
    needs: cppcheck-shard
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to finish
        env:
          SHARD_RESULT: ${{ needs.cppcheck-shard.result }}
        run: test "$SHARD_RESULT" = success

      - uses: actions/checkout@v3

      - name: Cache cppcheck binary
        uses: actions/cache@v4
        with:
          path: cppcheck_dir/build/bin
          key: cppcheck-2.17.1-bin

      # cppcheck's own incremental results (--cppcheck-build-dir in
      # cppcheck.sh). It keys each file's by a hash of the file as
      # preprocessed, so with its headers, and of the options, analyzes only
      # the files whose hash changed, and reports the rest's findings from the
      # cache. About 1.5 MB, saved under a new key by every successful run of
      # this job and restored from the latest this branch can see: its own,
      # else main's. This job uses the _WIN32 pass's from it; the shards'
      # replace the rest.
      - name: Cache cppcheck results
        uses: actions/cache@v4
        with:
          path: |
            cppcheck_build
            cppcheck_build-windows
          key: cppcheck-results-2.17.1-${{ hashFiles('cppcheck.sh') }}-${{ github.run_id }}
          restore-keys: cppcheck-results-2.17.1-${{ hashFiles('cppcheck.sh') }}-

      - uses: actions/download-artifact@v4
        with:
          pattern: cppcheck-shard-*
          path: cppcheck-shard-results

      - name: Merge the shards' results
        run: |
          rm -rf cppcheck_build
          mkdir cppcheck_build
          cp cppcheck-shard-results/*/* cppcheck_build/

      - name: Run cppcheck static analysis
        run: ./cppcheck.sh

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run clang-tidy static analysis
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 && ./tidy.sh clang-tidy-18

  unit-tests-no-pgo-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: latest
          platform: x64

      - name: Get datafile cache
        id: cache-datafiles
        uses: actions/cache@v3
        with:
          path: |
            data/*
            testdata/*
          key: downloaded-data-files-32

      - name: Download data files and convert lexica
        if: steps.cache-datafiles.outputs.cache-hit != 'true'
        run: ./download_data.sh && ./convert_lexica.sh

      - name: Build no-PGO release test binary
        run: make magpie_test BUILD=no_pgo_release

      - name: Build shared library
        run: make libmagpie

      - name: Install locale for PEG JSON regression
        run: sudo locale-gen de_DE.UTF-8

      - name: Run no-PGO release tests
        run: |
          ./bin/magpie_test
          ./bin/magpie_test pegpoll

  unit-tests-dev:
    name: unit-tests-dev (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: ap_default
            tests: "ap_default"
          - shard: ap_wmp
            tests: "ap_wmp"
          - shard: ap_rest
            tests: "ap_rest"
          - shard: sim
            tests: "sim endgame klv"
          - shard: eldar_v
            tests: "eldar_v endgameinject"
          - shard: analyze_sim
            tests: "analyze_sim"
          - shard: config
            tests: "config movegen gameplay players string stablesort compat gzipreader datafetch alpha ld l leavemap kwg bag rack bitrack board layout cs move game vm shadow eq eqadj stats infer rv am"
          - shard: rest
            tests: "endgamepause browsergame embedding fileproxy historyreplay peg_embedding pegpoll wordmapapi hm math bai command cmdapi gcg words wordprune kwgmaker cgp rl ch cv cd wmp wmpmaker wmg winpct zobrist tt load wit witcache witsweep contribute builderhash pat patfile patlexicon patutility patfeatures pateval"
          - shard: ap_rit
            tests: "ap_rit patwmp"
          - shard: simdet
            tests: "simdetigp"
    steps:
      - uses: actions/checkout@v3

      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: latest
          platform: x64

      - name: Get datafile cache
        id: cache-datafiles
        uses: actions/cache@v3
        with:
          path: |
            data/*
            testdata/*
          key: downloaded-data-files-32

      - name: Download data files and convert lexica
        if: steps.cache-datafiles.outputs.cache-hit != 'true'
        run: ./download_data.sh && ./convert_lexica.sh

      - name: Build no-PGO release binary for RIT construction
        if: matrix.shard == 'ap_rit'
        run: make magpie BUILD=no_pgo_release

      - name: Build RIT for TWL98
        if: matrix.shard == 'ap_rit'
        run: echo "convert klvwmp2rit TWL98" | ./bin/magpie "set -lex TWL98 -wmp true -rit false"

      - name: Fetch the data into an empty directory with data fetch
        if: matrix.shard == 'ap_rit'
        run: |
          mkdir -p fetch-test
          cd fetch-test
          ../bin/magpie data fetch < /dev/null
          # Every file GNU tar extracts from the same chunks, and nothing else
          # but the version marker. diff follows GNU tar's symlinks, which
          # data fetch writes as copies of their targets.
          version=$(sed -n 's/^#define DATA_FETCH_VERSION "\(.*\)"/\1/p' ../src/impl/data_fetch.h)
          suffixes=$(sed -n 's/^ *{"\([a-z][a-z]\)",.*/\1/p' ../src/impl/data_fetch.c)
          mkdir -p reference
          for suffix in $suffixes; do
            curl -fsSL "https://raw.githubusercontent.com/jvc56/MAGPIE-DATA/main/versioned-tarballs/data-$version.tgz.$suffix"
          done | tar -xzf - -C reference
          diff -r -x .data-version reference/data data
          rm -rf reference
          test ! -L data/lexica/CSW24_super21.klv2
          # A second fetch finds the data version already there.
          ../bin/magpie data fetch < /dev/null | grep -q "already holds data version"
          # The fetched lexicon has no wordmap: its first use builds one.
          printf 'set -lex CSW21\ncgp 15/15/15/15/15/15/15/15/15/15/15/15/15/15/15 ABCDEFG/ 0/0 0\ngen -numplays 1\n' \
            | ../bin/magpie | tee first-use.txt
          grep -q "building the wordmap for CSW21" first-use.txt
          test -s data/lexica/CSW21.wmp

      - name: Build dev test binary
        run: make magpie_test

      - name: Check native batch conversion failures
        if: matrix.shard == 'rest'
        run: |
          make magpie_convert
          if ./bin/magpie_convert invalid_conversion CSW21; then
            echo 'Invalid conversion unexpectedly succeeded'
            exit 1
          fi
          if ./bin/magpie_convert; then
            echo 'Missing conversion arguments unexpectedly succeeded'
            exit 1
          fi

      - name: Install locale for PEG JSON regression
        if: matrix.shard == 'rest'
        run: sudo locale-gen de_DE.UTF-8

      - name: Run dev tests
        run: ./bin/magpie_test ${{ matrix.tests }}

  unit-tests-super:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: latest
          platform: x64

      - name: Get datafile cache
        id: cache-datafiles
        uses: actions/cache@v3
        with:
          path: |
            data/*
            testdata/*
          key: downloaded-data-files-32

      - name: Download data files and convert lexica
        if: steps.cache-datafiles.outputs.cache-hit != 'true'
        run: ./download_data.sh && ./convert_lexica.sh

      - name: Build and run super no-PGO release tests
        run: |
          make magpie_test BUILD=no_pgo_release BOARD_DIM=21
          ./bin/magpie_test

      - name: Build and run super dev tests
        run: |
          make clean
          make magpie_test BOARD_DIM=21
          ./bin/magpie_test

  wasm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Get datafile cache
        id: cache-datafiles
        uses: actions/cache@v3
        with:
          path: |
            data/*
            testdata/*
          key: downloaded-data-files-32

      - name: Download data files and convert lexica
        if: steps.cache-datafiles.outputs.cache-hit != 'true'
        run: ./download_data.sh && ./convert_lexica.sh

      - name: Build WASM tests
        run: make -f Makefile-wasm magpie_wasm_test

      - name: Run WASM tests
        run: node ./bin/magpie_wasm_test.js endgame_wasm endgamepause tt zobrist embedding fileproxy historyreplay peg_embedding pegpoll wordmapapi

  ci-summary:
    if: always()
    needs:
      - lint-fast
      - windows-cross-compile
      - windows-wine-tests
      - windows-native-tests
      - cppcheck
      - clang-tidy
      - unit-tests-no-pgo-release
      - unit-tests-dev
      - unit-tests-super
      - wasm-tests
    runs-on: ubuntu-latest
    steps:
      - name: CI Results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint-fast | \`${{ needs.lint-fast.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| windows-cross-compile | \`${{ needs.windows-cross-compile.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| windows-wine-tests | \`${{ needs.windows-wine-tests.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| windows-native-tests | \`${{ needs.windows-native-tests.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| cppcheck | \`${{ needs.cppcheck.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| clang-tidy | \`${{ needs.clang-tidy.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| unit-tests-no-pgo-release | \`${{ needs.unit-tests-no-pgo-release.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| unit-tests-dev | \`${{ needs.unit-tests-dev.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| unit-tests-super | \`${{ needs.unit-tests-super.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| wasm-tests | \`${{ needs.wasm-tests.result }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        if: |
          needs.lint-fast.result != 'success' ||
          needs.windows-cross-compile.result != 'success' ||
          needs.windows-wine-tests.result != 'success' ||
          needs.windows-native-tests.result != 'success' ||
          needs.cppcheck.result != 'success' ||
          needs.clang-tidy.result != 'success' ||
          needs.unit-tests-no-pgo-release.result != 'success' ||
          needs.unit-tests-dev.result != 'success' ||
          needs.unit-tests-super.result != 'success' ||
          needs.wasm-tests.result != 'success'
        run: exit 1
